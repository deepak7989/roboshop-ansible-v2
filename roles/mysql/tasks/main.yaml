- name: get the password from AWS secrets manager
  debug:
    msg: "lookup('amazon.aws.aws_secret', 'roboshop/mysql_root_password', region='us-east-1')"
- name: instrall mysql
  package:
    name: mysql-server
    state: present
- name: start and enable
  service:
    state: started
    enabled: yes
    name: mysqld
- name: setup root password
  command: mysql_secure_installation --set-root-pass "{{ MYSQL_ROOT_PASSWORD }}"